# Component capture manifest.
#
# Each entry maps one SDK playground UI state to a docs image. `selector`
# should prefer [data-testid=...], then role/text - CSS classes and XPath
# are banned (they break silently when the playground UI changes).
#
# id:        globally-unique, referenced by `npm run capture -- --ids <id>`
# route:     path under SDK_PLAYGROUND_URL, e.g. /playground.html?demo=widget
# viewport:  optional {width, height}; defaults to 1440x900 (captured at 2x)
# sidebarWidth: optional; defaults to 460 so "Continue in Libra" keeps its label.
#            Override only to show responsive behavior.
# video:     true to record an .mp4 instead of a screenshot
# actions:   ordered list of {frame|click|clickPopup|clickLast|fill|select|press|hover|waitFor|waitForHidden|wait|scrollTo|clipStart}
#            press: {selector, key} focuses an element and presses a key (some
#            menus only open from the keyboard in headless Chromium).
# selector:  element to screenshot, or "viewport" for the whole screen. Use
#            "viewport" whenever the SDK opens UI outside its sidebar.
# frame:     optional iframe selector for actions or screenshot scope.
#            `frame: popup` targets the window opened by a clickPopup action.
# readOnly:  answer every non-GET API call locally so nothing is saved or sent
# apiResponses: replace whole GET responses by path (apiOverrides merges fields)
# signedOut: true to capture without the saved session (sign-in screens)
# fakeMic:   WAV file (relative to assets-pipeline/) played as the microphone,
#            for voice input. Transcription is real; nothing is sent to chat.
# annotations: optional ordered list of {selector, frame?, at?} controls to number.
#            Capture measures their positions into snippets/screenshot-markers.jsx;
#            pages show the numbers with the AnnotatedImage component. `at` is
#            top-right (default) or top-left (on the element), or below,
#            above, left, or right (beside it, so text stays readable).
#            dx/dy (px) nudge a marker into empty space. `frame: page` numbers
#            host-page elements (the playground controls) instead of SDK ones.
# output:    path (relative to repo root) the docs page references
# page:      the .mdx page this asset belongs to (for validate/orphan checks)
#
# /playground-2.html is used because its host area has no harness controls.
# Only the Playground page shows /playground.html with its controls.
# Captures use the "Demo Project" seeded from demo-content/ (see README).

# The SDK release the published docs describe. `capture --target release`
# loads /versions/v<sdkVersion>/ and refuses assets from any other SDK build.
# captures.json records the build each asset came from.
sdkVersion: 0.15.1

# Fields merged into the signed-in user the SDK loads (GET /api/v1/auths/)
# during captures, so screenshots show a generic person. The account is not
# changed. A component can add its own `sessionUser` to mock account states.
sessionUser:
  name: John Doe
  first_name: John
  last_name: Doe
  email: john.doe@example.com

# Fields merged into other API responses (by path) during captures, so no real
# colleague's name or email appears. Components can add their own entries.
apiOverrides:
  /api/v1/teams/owner:
    name: Jane Smith
    email: jane.smith@example.com

# SDK init options the playground loads from localStorage before each capture.
# Rule: show a Wolters Kluwer research source, not web search, unless the
# example needs another source (override `playgroundConfig` on the component).
playgroundConfig:
  researchSources: [wko_de]

